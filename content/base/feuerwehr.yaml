# Feuerwehr im Landkreis Brakenfeld (M6). Eigene Fahrzeugkennzahlen und eigenes Stichwortschema –
# reale Schemata unterscheiden sich je Land. Zeiten und Häufigkeiten sind Annahmen,
# siehe docs/domain/feuerwehr.md.
vehicleTypes:
  - {id: base:elw1, short: ELW 1, name: Einsatzleitwagen, canTransport: false, radioCode: 11}
  - {id: base:hlf, short: HLF, name: Hilfeleistungslöschfahrzeug, canTransport: false, radioCode: 46}
  - {id: base:lf, short: LF, name: Löschgruppenfahrzeug, canTransport: false, radioCode: 44}
  - {id: base:dlk, short: DLK, name: Drehleiter, canTransport: false, radioCode: 33}
  - {id: base:rw, short: RW, name: Rüstwagen, canTransport: false, radioCode: 52}
  - {id: base:tlf, short: TLF, name: Tanklöschfahrzeug, canTransport: false, radioCode: 24}

