keywords:
  - id: base:b1
    code: B 1
    name: Kleinbrand
    description: Kleinbrand im Freien, Mülleimer, PKW, ausgelöster Heimrauchmelder
    priority: 2
    emergency: true
    aao: [{type: base:hlf, count: 1, alternatives: [base:lf]}]
  - id: base:b2
    code: B 2
    name: Brand Gebäude
    description: Zimmer-, Küchen- oder Wohnungsbrand, Menschenleben ggf. in Gefahr
    priority: 1
    emergency: true
    aao:
      - {type: base:elw1, count: 1}
      - {type: base:hlf, count: 2, alternatives: [base:lf]}
      - {type: base:dlk, count: 1}
      - {type: base:rtw, count: 1}
  - id: base:b3
    code: B 3
    name: Großbrand
    description: Ausgedehnter Gebäudebrand, Dachstuhlbrand, mehrere Einheiten nötig
    priority: 1
    emergency: true
    aao:
      - {type: base:elw1, count: 1}
      - {type: base:hlf, count: 3, alternatives: [base:lf]}
      - {type: base:dlk, count: 1}
      - {type: base:tlf, count: 1}
      - {type: base:rtw, count: 1}
      - {type: base:nef, count: 1}
  - id: base:th1
    code: TH 1
    name: Hilfeleistung klein
    description: Ölspur, Baum auf Fahrbahn, Wasser im Keller – keine Menschen in Gefahr
    priority: 3
    emergency: false
    aao: [{type: base:lf, count: 1, alternatives: [base:hlf]}]
  - id: base:th2
    code: TH 2
    name: VU eingeklemmt
    description: Verkehrsunfall mit eingeklemmter Person
    priority: 1
    emergency: true
    aao:
      - {type: base:hlf, count: 1, alternatives: [base:lf]}
      - {type: base:rw, count: 1}
      - {type: base:rtw, count: 1}
      - {type: base:nef, count: 1}

fireScenarios:
  - id: base:fire-bin
    name: Mülleimer- oder Containerbrand
    weight: 5
    kind: brand
    keyword: base:b1
    outdoor: true
    reports: [{key: fire_bin, weight: 1}]
    needs: [{type: base:hlf, count: 1, alternatives: [base:lf]}]
    workMinutes: [10, 20]
  - id: base:fire-car
    name: PKW-Brand
    weight: 4
    kind: brand
    keyword: base:b1
    outdoor: true
    reports: [{key: fire_car, weight: 1}]
    needs: [{type: base:hlf, count: 1, alternatives: [base:lf]}]
    workMinutes: [20, 35]
  - id: base:fire-alarm
    name: Heimrauchmelder ausgelöst (angebranntes Essen)
    weight: 5
    kind: brand
    keyword: base:b1
    reports: [{key: fire_alarm, weight: 1}]
    needs: [{type: base:hlf, count: 1, alternatives: [base:lf]}]
    workMinutes: [10, 20]
  - id: base:fire-kitchen
    name: Küchenbrand
    weight: 4
    kind: brand
    keyword: base:b2
    reports: [{key: fire_kitchen, weight: 3}, {key: fire_smoke, weight: 1}]
    needs: [{type: base:hlf, count: 1, alternatives: [base:lf]}]
    workMinutes: [20, 35]
    casualty: {diagnosis: base:smoke-inhalation, probability: 0.3}
    escalation: {after: [9, 15], to: base:fire-flat}
  - id: base:fire-flat
    name: Wohnungsbrand
    weight: 3
    kind: brand
    keyword: base:b2
    reports: [{key: fire_smoke, weight: 3}, {key: fire_flames, weight: 1}]
    needs:
      - {type: base:elw1, count: 1}
      - {type: base:hlf, count: 2, alternatives: [base:lf]}
      - {type: base:dlk, count: 1}
    workMinutes: [45, 75]
    casualty: {diagnosis: base:smoke-inhalation, probability: 0.5}
    escalation: {after: [16, 25], to: base:fire-roof}
  - id: base:fire-roof
    name: Dachstuhlbrand
    weight: 1
    kind: brand
    keyword: base:b3
    reports: [{key: fire_roof, weight: 1}]
    needs:
      - {type: base:elw1, count: 1}
      - {type: base:hlf, count: 3, alternatives: [base:lf]}
      - {type: base:dlk, count: 1}
      - {type: base:tlf, count: 1}
    workMinutes: [120, 180]
    casualty: {diagnosis: base:smoke-inhalation, probability: 0.2}
  - id: base:th-oil
    name: Ölspur
    weight: 4
    kind: th
    keyword: base:th1
    outdoor: true
    reports: [{key: th_oil, weight: 1}]
    needs: [{type: base:lf, count: 1, alternatives: [base:hlf]}]
    workMinutes: [30, 60]
  # Flächen- und Waldbrand: im Normalfall selten, bei Hitze und Trockenheit häufig.
  - id: base:vegetation
    name: Flächen- oder Waldbrand
    weight: 0.3
    kind: brand
    keyword: base:b2
    outdoor: true
    reports: [{key: fire_field, weight: 1}]
    needs: [{type: base:tlf, count: 1}, {type: base:lf, count: 2, alternatives: [base:hlf]}]
    workMinutes: [45, 90]
  - id: base:th-tree
    name: Baum auf Fahrbahn
    weight: 3
    kind: th
    keyword: base:th1
    outdoor: true
    reports: [{key: th_tree, weight: 1}]
    needs: [{type: base:lf, count: 1, alternatives: [base:hlf]}]
    workMinutes: [20, 40]
  - id: base:th-trapped
    name: Verkehrsunfall mit eingeklemmter Person
    weight: 2
    kind: th
    keyword: base:th2
    outdoor: true
    reports: [{key: th_trapped, weight: 1}]
    needs:
      - {type: base:hlf, count: 1, alternatives: [base:lf]}
      - {type: base:rw, count: 1}
    workMinutes: [35, 55]
    casualty: {diagnosis: base:traffic-injury, probability: 1}
