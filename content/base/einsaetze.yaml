# Eigenes Stichwortschema und Krankheitsbilder („wahre Lage") für den Rettungsdienst.
# Häufigkeiten, NACA-Bereiche und Zeiten sind Annahmen für die Spielbalance, siehe
# docs/domain/einsaetze.md. Anrufer schildern die Lage über `reports` – nicht immer richtig.
keywords:
  - id: base:rd1
    code: RD 1
    name: Notfall
    description: Akute Erkrankung oder Verletzung ohne erkennbare Notarzt-Indikation
    priority: 2
    emergency: true
    aao: [{type: base:rtw, count: 1}]
  - id: base:rd2
    code: RD 2
    name: Notfall mit Notarzt
    description: Lebensbedrohliche Erkrankung oder Verletzung, Notarzt-Indikation
    priority: 1
    emergency: true
    aao: [{type: base:rtw, count: 1}, {type: base:nef, count: 1}]
  - id: base:rd3
    code: RD 3
    name: Reanimation
    description: Bewusstlos, keine normale Atmung – Herz-Kreislauf-Stillstand
    priority: 1
    emergency: true
    aao: [{type: base:rtw, count: 2}, {type: base:nef, count: 1}]
  - id: base:rd0
    code: RD 0
    name: Hilfeleistung
    description: Nicht zeitkritisch, Anfahrt ohne Sonderrechte
    priority: 3
    emergency: false
    aao: [{type: base:rtw, count: 1}]

diagnoses:
  - id: base:acs
    name: Akutes Koronarsyndrom
    weight: 9
    ageRange: [40, 92]
    naca: [3, 5]
    tracer: acs
    keyword: base:rd2
    doctorNeeded: 0.8
    transport: 1
    department: herzkatheter
    onSceneMinutes: [15, 25]
    reports: [{key: chest_pain, weight: 8}, {key: unwell, weight: 2}]
  - id: base:stroke
    name: Schlaganfall
    weight: 7
    ageRange: [50, 95]
    naca: [3, 4]
    tracer: stroke
    keyword: base:rd1
    doctorNeeded: 0.25
    transport: 1
    department: stroke
    onSceneMinutes: [12, 20]
    reports: [{key: stroke_signs, weight: 6}, {key: confused, weight: 3}, {key: fall, weight: 1}]
  - id: base:dyspnea
    name: Atemnot (COPD, Asthma, Herzinsuffizienz)
    weight: 9
    ageRange: [25, 95]
    naca: [3, 4]
    keyword: base:rd1
    doctorNeeded: 0.4
    transport: 0.9
    department: innere
    onSceneMinutes: [15, 25]
    reports: [{key: breathing, weight: 9}, {key: unwell, weight: 1}]
  - id: base:fall
    name: Häuslicher Sturz
    weight: 14
    ageRange: [65, 99]
    naca: [2, 3]
    keyword: base:rd1
    doctorNeeded: 0.05
    transport: 0.7
    department: unfallchirurgie
    onSceneMinutes: [15, 30]
    reports: [{key: fall, weight: 9}, {key: helpless_person, weight: 2}]
  - id: base:hypoglycemia
    name: Unterzuckerung
    weight: 5
    ageRange: [20, 90]
    naca: [3, 4]
    keyword: base:rd2
    doctorNeeded: 0.2
    transport: 0.35
    department: innere
    onSceneMinutes: [15, 25]
    reports: [{key: unconscious, weight: 5}, {key: confused, weight: 4}]
  - id: base:cardiac-arrest
