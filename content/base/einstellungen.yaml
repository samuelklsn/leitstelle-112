# Spiel- und Bereichseinstellungen. Herleitung der Werte: docs/domain/.
settings:
  hilfsfrist:
    label: 12 Minuten in 95 % der Notfälle
    minutes: 12
    targetQuota: 0.95
    # Eintreffzeit des ersten Löschfahrzeugs (Annahme, typische Planungsgröße 8–10 Min.).
    fireMinutes: 10
    # Ehrliche Kennzeichnung: Die Landesregelungen unterscheiden sich in Dauer, Messbeginn und
    # Quote. Presets je Bundesland mit Quellen folgen (Issue #32).
    source: Annahme für den fiktiven Landkreis (gemessen ab Eingang des Notrufs)
  shift:
    startHour: 7
    hours: 12
  calls:
    # Spielbalance: etwa das Doppelte eines realen Mittelwerts, damit eine Schicht nicht nur
    # aus Warten besteht. Über Schwierigkeitsgrade anpassbar (M12).
    ratePer100k: 2.4
    hourlyProfile: [0.6, 0.5, 0.45, 0.4, 0.4, 0.5, 0.75, 1.0, 1.25, 1.4, 1.45, 1.45,
                    1.35, 1.3, 1.25, 1.2, 1.2, 1.15, 1.1, 1.05, 1.0, 0.9, 0.8, 0.7]
    # Wochenmuster Montag … Sonntag (Annahme: Wochenende und Freitag etwas mehr).
    weekdayFactor: [1.0, 0.96, 0.96, 0.98, 1.04, 1.1, 1.04]
    abandonAfterSeconds: [45, 180]
    # Antwortzeit je Frage der Notrufabfrage – aufgeregte Anrufer brauchen 3 s länger.
    answerSeconds: [3, 8]
    # Anteil der Notrufe für die Feuerwehr (Brand und Technische Hilfe), Annahme.
    fireShare: 0.15
    # Anteile besonderer Anrufe (Annahmen, docs/domain/einsaetze.md).
    kinds: {misdial: 0.06, prank: 0.03, info: 0.05, duplicate: 0.12, police: 0.25}
  times:
    turnoutDaySeconds: [50, 90]
    turnoutNightSeconds: [90, 150]
    turnoutMobileSeconds: [10, 25]
    handoverMinutes: [15, 25]
    destinationTimeoutSeconds: 180
    callbackSeconds: [60, 120]
  caller: {wrongHouseNumber: 0.06, missingTown: 0.12, misjudge: 0.2}
  # Wetterlagen halten 3–8 Stunden; mit 40 % bleibt das Wetter beim Wechsel gleich.
  weather: {changeHours: [3, 8], persistence: 0.4}
  # Einsatz-Regie: Aufkommen schwankt in Phasen von 30–90 Minuten um höchstens ± 25 %.
  director: {amplitude: 0.25, phaseMinutes: [30, 90]}
  # Tageslicht je Monat (hell ab, dunkel ab; Ortszeit inkl. Sommerzeit), Mitteldeutschland.
  daylight: [[8, 16], [8, 17], [7, 18], [7, 20], [6, 21], [5, 21], [6, 21], [6, 20], [7, 19], [8, 18], [7, 16], [8, 16]]
  # Luftrettung: Reisegeschwindigkeit, Start und Landung; Einsätze außerhalb des Kreises.
  air: {speedKmh: 220, liftoffSeconds: [120, 240], landingSeconds: [120, 180], externalPerHour: 0.12, externalMinutes: [45, 90]}
  # Transportaufträge (Krankentransport, Verlegung). Annahme: tagsüber etwa so viele wie
  # Notrufe, nachts kaum welche (docs/domain/logistik.md).
  transports:
    ratePer100k: 1.6
    hourlyProfile: [0.1, 0.05, 0.05, 0.05, 0.05, 0.1, 0.4, 1.2, 1.9, 2.0, 2.0, 1.8,
                    1.6, 1.7, 1.7, 1.5, 1.2, 0.9, 0.6, 0.4, 0.3, 0.2, 0.15, 0.1]
    toleranceMinutes: 15
    # Am Wochenende und an Feiertagen kaum Krankentransporte (Praxen geschlossen).
    restDayFactor: 0.35
    # Am Vortag bestellt: Termine in den ersten drei Stunden der Schicht.
    preBooked: 5
    preBookedMinutes: [20, 180]
  # Verfügbarkeit von Fahrzeugen, Besatzungen und Kliniken (Annahmen, docs/domain/logistik.md).
  logistics:
    disinfectionMinutes: [30, 50]
    fuelHours: 8
    refuelMinutes: [10, 15]
    defectPerMission: 0.008
    defectHours: [1, 3]
    crewChangeHours: [7, 19]
    breakAfterHours: 6
    breakMinutes: 30
    bedReleasePerHour: 0.45
    bedOtherPerHour: 0.35
    closurePerDay: 0.35
    closureHours: [1, 3]
