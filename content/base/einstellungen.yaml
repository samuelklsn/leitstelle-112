# Spiel- und Bereichseinstellungen. Herleitung der Werte: docs/domain/.
settings:
  hilfsfrist:
    label: 12 Minuten in 95 % der Notfälle
    minutes: 12
    targetQuota: 0.95
    # Ehrliche Kennzeichnung: Die Landesregelungen unterscheiden sich in Dauer, Messbeginn und
    # Quote. Presets je Bundesland mit Quellen folgen (Issue #32).
    source: Annahme für den fiktiven Landkreis (gemessen ab Eingang des Notrufs)
  shift: {startHour: 7, hours: 12}
  calls:
    # Spielbalance: etwa das Doppelte eines realen Mittelwerts, damit eine Schicht nicht nur
    # aus Warten besteht. Über Schwierigkeitsgrade anpassbar (M12).
    {ratePer100k: 2.4, hourlyProfile: [0.6, 0.5, 0.45, 0.4, 0.4, 0.5, 0.75, 1.0, 1.25, 1.4, 1.45, 1.45, 1.35, 1.3, 1.25, 1.2, 1.2, 1.15, 1.1, 1.05, 1.0, 0.9, 0.8, 0.7], abandonAfterSeconds: [45, 180]}
  times: {turnoutDaySeconds: [50, 90], turnoutNightSeconds: [90, 150], turnoutMobileSeconds: [10, 25], handoverMinutes: [15, 25], destinationTimeoutSeconds: 180, callbackSeconds: [60, 120]}
  caller: {wrongHouseNumber: 0.06, missingTown: 0.12, misjudge: 0.2}
