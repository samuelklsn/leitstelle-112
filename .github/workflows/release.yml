name: Release

# Ein Tag „vX.Y.Z" baut den Windows-Installer und veröffentlicht ihn als GitHub-Release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Installer bauen und veröffentlichen
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}\.cache\electron-builder
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - run: pnpm --filter @ls112/desktop package
      - name: Release-Notizen aus dem CHANGELOG
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          $text = Get-Content CHANGELOG.md -Raw
          $pattern = "(?s)## \[$([regex]::Escape($version))\].*?(?=\r?\n## \[|\r?\n\[Unreleased\]:|$)"
          $notes = [regex]::Match($text, $pattern).Value
          if (-not $notes) { $notes = "Version $version" }
          Set-Content -Path release-notes.md -Value $notes -Encoding utf8
      - name: GitHub-Release erstellen
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $prerelease = if ('${{ github.ref_name }}' -match '^v0\.') { '--prerelease' } else { '' }
          gh release create '${{ github.ref_name }}' apps/desktop/release/*.exe `
            --title "Leitstelle 112 ${{ github.ref_name }}" --notes-file release-notes.md $prerelease
