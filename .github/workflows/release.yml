name: Release

# Ein Tag „vX.Y.Z" baut den Windows-Installer und die Android-APK und veröffentlicht beide als
# GitHub-Release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Installer bauen und veröffentlichen
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}\.cache\electron-builder
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - run: pnpm --filter @ls112/desktop package
      - name: Release-Notizen aus dem CHANGELOG
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          $text = Get-Content CHANGELOG.md -Raw
          $pattern = "(?s)## \[$([regex]::Escape($version))\].*?(?=\r?\n## \[|\r?\n\[Unreleased\]:|$)"
          $notes = [regex]::Match($text, $pattern).Value
          if (-not $notes) { $notes = "Version $version" }
          Set-Content -Path release-notes.md -Value $notes -Encoding utf8
      - name: GitHub-Release erstellen
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          # Argumente als Liste: Ohne Vorabversion darf kein leeres Argument entstehen.
          $installer = Get-ChildItem apps/desktop/release/*.exe | Select-Object -ExpandProperty FullName
          $ghArgs = @('release', 'create', '${{ github.ref_name }}') + $installer + @(
            '--title', 'Leitstelle 112 ${{ github.ref_name }}', '--notes-file', 'release-notes.md')
          if ('${{ github.ref_name }}' -match '^v0\.') { $ghArgs += '--prerelease' }
          gh @ghArgs

  android:
    name: Android-APK anhängen
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - run: pnpm install --frozen-lockfile
      # Noch ohne eigenen Signaturschlüssel: Debug-signierte APK zum direkten Installieren
      # (docs/android.md, „Veröffentlichen").
      - run: pnpm --filter @ls112/android apk
      - name: APK an das Release hängen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          cp apps/android/android/app/build/outputs/apk/debug/app-debug.apk "Leitstelle112-${version}.apk"
          gh release upload "$GITHUB_REF_NAME" "Leitstelle112-${version}.apk"
