name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    name: Build & Test (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}\.cache\electron-builder
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: pnpm einrichten
        uses: pnpm/action-setup@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Abhängigkeiten installieren
        run: pnpm install --frozen-lockfile

      - name: Formatierung prüfen
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typprüfung
        run: pnpm typecheck

      - name: Unit- und Property-Tests mit Coverage
        run: pnpm coverage

      - name: Performance-Budget (300 Fahrzeuge, 100 Einsätze)
        run: pnpm test:perf

      - name: Build
        run: pnpm build

      - name: E2E-Tests (Playwright + Electron)
        run: pnpm e2e

      - name: Windows-Installer bauen (NSIS)
        run: pnpm --filter @ls112/desktop package

      - name: Installer hochladen
        uses: actions/upload-artifact@v4
        with:
          name: Leitstelle112-Setup-${{ github.sha }}
          path: apps/desktop/release/*.exe
          if-no-files-found: error
          retention-days: 14

      - name: Playwright-Bericht hochladen
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
