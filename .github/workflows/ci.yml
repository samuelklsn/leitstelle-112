name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    name: Build & Test (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}\.cache\electron-builder
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: pnpm einrichten
        uses: pnpm/action-setup@v6

      - name: Node.js einrichten
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Abhängigkeiten installieren
        run: pnpm install --frozen-lockfile

      - name: Formatierung prüfen
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typprüfung
        run: pnpm typecheck

      - name: Unit- und Property-Tests mit Coverage
        run: pnpm coverage

      - name: Performance-Budget (300 Fahrzeuge, 100 Einsätze)
        run: pnpm test:perf

      - name: Build
        run: pnpm build

      - name: E2E-Tests (Playwright + Electron)
        run: pnpm e2e

      - name: Windows-Installer bauen (NSIS)
        run: pnpm --filter @ls112/desktop package

      - name: Installer hochladen
        uses: actions/upload-artifact@v7
        with:
          name: Leitstelle112-Setup-${{ github.sha }}
          path: apps/desktop/release/*.exe
          if-no-files-found: error
          retention-days: 14

      - name: Playwright-Bericht hochladen
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  android:
    name: Android-APK (ADR-0021)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: pnpm einrichten
        uses: pnpm/action-setup@v6

      - name: Node.js einrichten
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: JDK 21 einrichten
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Abhängigkeiten installieren
        run: pnpm install --frozen-lockfile

      # Das Android-SDK ist auf den Ubuntu-Runnern vorinstalliert (ANDROID_HOME).
      - name: APK bauen
        run: pnpm --filter @ls112/android apk

      - name: APK hochladen
        uses: actions/upload-artifact@v7
        with:
          name: Leitstelle112-Android-${{ github.sha }}
          path: apps/android/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  mac3d:
    name: 3D-Mac-App (ADR-0022)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: pnpm einrichten
        uses: pnpm/action-setup@v6

      - name: Node.js einrichten
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Abhängigkeiten installieren
        run: pnpm install --frozen-lockfile

      - name: Web-Teil bauen
        run: pnpm --filter @ls112/mac3d build:web

      - name: Swift-Tests (Leitstelle3DKit)
        working-directory: apps/mac3d
        run: swift test

      - name: App bauen
        working-directory: apps/mac3d
        run: swift build -c release
